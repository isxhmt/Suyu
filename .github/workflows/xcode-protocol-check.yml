name: Inspect Xcode ChatGPT protocol constants
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/xcode-protocol-check.yml]
permissions: {}
jobs:
  inspect:
    runs-on: macos-26
    timeout-minutes: 3
    steps:
      - name: Inspect identified Xcode model frameworks
        shell: bash
        run: |
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib, plistlib, re, struct, subprocess, time
          from urllib.parse import urlsplit, parse_qs
          
          def emit(kind, **data):
              print(json.dumps({"kind": kind, **data}, ensure_ascii=True), flush=True)
          
          def macho_sections(data):
              fat = {b"\xca\xfe\xba\xbe": (">", False), b"\xbe\xba\xfe\xca": ("<", False),
                     b"\xca\xfe\xba\xbf": (">", True), b"\xbf\xba\xfe\xca": ("<", True)}
              base = 0
              if data[:4] in fat:
                  endian, wide = fat[data[:4]]
                  count = struct.unpack_from(endian + "I", data, 4)[0]
                  if count > 20:
                      raise ValueError("Unexpected FAT architecture count")
                  architectures = []
                  for i in range(count):
                      entry = struct.unpack_from(endian + ("iiQQII" if wide else "iiIII"),
                                                 data, 8 + i * (32 if wide else 20))
                      cpu, _, offset, size = entry[:4]
                      if offset + size > len(data):
                          raise ValueError("Invalid FAT slice")
                      architectures.append((cpu != 0x0100000C, offset))
                  base = min(architectures)[1]
              magic = data[base:base + 4]
              if magic not in (b"\xcf\xfa\xed\xfe", b"\xfe\xed\xfa\xcf"):
                  raise ValueError("Not a 64-bit Mach-O image")
              endian = "<" if magic == b"\xcf\xfa\xed\xfe" else ">"
              ncmds, command_bytes = struct.unpack_from(endian + "II", data, base + 16)
              pos, stop = base + 32, base + 32 + command_bytes
              if ncmds > 10000 or stop > len(data):
                  raise ValueError("Invalid load commands")
              sections = []
              for _ in range(ncmds):
                  cmd, size = struct.unpack_from(endian + "II", data, pos)
                  if size < 8 or pos + size > stop:
                      raise ValueError("Invalid load command size")
                  if cmd == 0x19:
                      count = struct.unpack_from(endian + "I", data, pos + 64)[0]
                      if 72 + count * 80 > size:
                          raise ValueError("Invalid section list")
                      for j in range(count):
                          at = pos + 72 + j * 80
                          section = data[at:at + 16].split(b"\0")[0].decode("ascii")
                          segment = data[at + 16:at + 32].split(b"\0")[0].decode("ascii")
                          address, length, offset = struct.unpack_from(endian + "QQI", data, at + 32)
                          if section in ("__cstring", "__swift5_reflstr", "__ustring"):
                              start = base + offset
                              if start + length > len(data):
                                  raise ValueError("Invalid string section bounds")
                              sections.append((segment, section, start, length, address))
                  pos += size
              return sections
          
          url_rx = re.compile(r"https?://[^\s\"'<>\\]{4,256}")
          signal = re.compile(r"chatgpt|openai|floodgate|oauth|client.?id|redirect|authoriz|"
                              r"bearer|scope|audience|responses|chat/completions|"
                              r"api.?key|token|x-apple|x-openai|originator|attest|anonymous", re.I)
          secret = re.compile(r"(?i)\b(?:sk[-_]|gh[pousr]_)[A-Za-z0-9_-]{12,}|\beyJ[A-Za-z0-9_.-]{40,}")
          public_id = re.compile(r"^(?:app_[A-Za-z0-9_-]{8,100}|[a-fA-F0-9]{8}(?:-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12})$")
          def safe_text(text):
              def clean(m):
                  try:
                      p = urlsplit(m.group().rstrip("),.;"))
                      host = p.hostname or ""
                      if ":" in host:
                          host = "[" + host + "]"
                      if p.port is not None:
                          host += ":" + str(p.port)
                      result = p.scheme + "://" + host + p.path
                      public = {k: v for k, v in parse_qs(p.query).items()
                                if k in ("client_id", "redirect_uri", "response_type", "scope", "audience")}
                      if public:
                          result += " [public_oauth=" + json.dumps(public, sort_keys=True) + "]"
                      return result
                  except ValueError:
                      return "[invalid-url]"
              text = secret.sub("[redacted]", text)
              text = url_rx.sub(clean, text)
              return text[:360]
          
          started = time.monotonic()
          selected = os.environ.get("DEVELOPER_DIR") or subprocess.check_output(
              ["/usr/bin/xcode-select", "-p"], text=True, timeout=5).strip()
          selected = pathlib.Path(selected).resolve()
          app = next((p for p in (selected, *selected.parents) if p.suffix == ".app"), None)
          if not app or app.parent != pathlib.Path("/Applications") or not app.name.startswith("Xcode"):
              raise SystemExit("Expected a preinstalled Xcode app")
          info = plistlib.loads((app / "Contents/Info.plist").read_bytes())
          build_info = plistlib.loads((app / "Contents/version.plist").read_bytes())
          emit("xcode", path=str(app), version=info.get("CFBundleShortVersionString"),
               build=build_info.get("ProductBuildVersion"))
          targets = ["IDEIntelligenceModelService", "IDEIntelligenceFoundation", "IDEIntelligenceChat"]
          total, matches = 0, 0
          for name in targets:
              path = (app / "Contents/PlugIns" / (name + ".framework") / "Versions/A" / name).resolve()
              if not path.is_relative_to(app) or not path.is_file():
                  emit("missing", component=name)
                  continue
              if path.stat().st_size > 256 * 1024**2:
                  emit("skip_size", component=name)
                  continue
              data = path.read_bytes()
              total += len(data)
              emit("binary", component=name, bytes=len(data), sha256=hashlib.sha256(data).hexdigest())
              try:
                  sections = macho_sections(data)
              except (ValueError, struct.error) as error:
                  emit("parse_error", component=name, error=str(error))
                  continue
              emitted = 0
              for segment, section, offset, length, address in sections:
                  emit("section", component=name, name=segment + "," + section, bytes=length)
                  payload = data[offset:offset + length]
                  if section == "__ustring":
                      chunks = [(m.start(), m.group().decode("utf-16le", errors="ignore"))
                                for m in re.finditer(rb"(?:[\x20-\x7e]\x00){4,512}", payload)]
                  else:
                      chunks = [(m.start(), m.group().decode("utf-8", errors="replace"))
                                for m in re.finditer(rb"[^\x00]{4,2048}", payload)]
                  selected_indices = set()
                  for i, (_, value) in enumerate(chunks):
                      if signal.search(value) or public_id.fullmatch(value):
                          selected_indices.update(range(max(0, i - 2), min(len(chunks), i + 3)))
                  priority = re.compile(r"chatgpt|openai|floodgate|^app_|https?://", re.I)
                  ordered = sorted(selected_indices, key=lambda i: (
                      not bool(priority.search(chunks[i][1]) or public_id.fullmatch(chunks[i][1])),
                      not bool(signal.search(chunks[i][1])), i))
                  for i in ordered:
                      relative, value = chunks[i]
                      if len(value) > 700 or value.startswith(("$s", "_$s")):
                          continue
                      emit("constant", component=name, section=section,
                           offset=hex(offset + relative), address=hex(address + relative),
                           matched=bool(signal.search(value) or public_id.fullmatch(value)),
                           value=safe_text(value))
                      emitted += 1
                      matches += 1
                      if emitted >= 400:
                          break
                  if emitted >= 400:
                      emit("truncated", component=name, limit=400)
                      break
              resource_root = path.parent / "Resources"
              if resource_root.is_dir():
                  candidates = sorted(p.relative_to(resource_root).as_posix() for p in resource_root.rglob("*")
                                      if p.is_file() and p.suffix in (".json", ".plist", ".yaml", ".js"))
                  emit("resources", component=name, files=candidates[:60], truncated=len(candidates) > 60)
          emit("coverage", binary_bytes=total, constants=matches, seconds=round(time.monotonic()-started, 1),
               dynamic_auth_test=False)
          symbol_rx = re.compile(r"BuiltInChatGPT|GenerativePartner|ExternalAI|xcodeClientID|"
                                 r"builtInClaude|chatgptGMSIdentifier|ModelBundle|getCredentialedURL", re.I)
          for name in ("IDEIntelligenceModelService", "IDEIntelligenceChat"):
              path = app / "Contents/PlugIns" / (name + ".framework") / "Versions/A" / name
              symbols = subprocess.run(["/usr/bin/xcrun", "nm", "-arch", "arm64", "-j", str(path)],
                                       capture_output=True, text=True, timeout=20)
              if symbols.returncode:
                  emit("symbol_error", component=name, returncode=symbols.returncode)
                  continue
              chosen = sorted({s for s in symbols.stdout.splitlines() if symbol_rx.search(s)})
              decoded = subprocess.run(["/usr/bin/xcrun", "swift-demangle", "--compact"],
                                       input="\n".join(chosen[:220]), capture_output=True, text=True, timeout=15)
              for value in decoded.stdout.splitlines():
                  emit("symbol", component=name, value=value[:900])
              emit("symbol_coverage", component=name, matched=len(chosen), emitted=min(len(chosen), 220))
              dependencies = subprocess.run(["/usr/bin/otool", "-L", str(path)],
                                            capture_output=True, text=True, timeout=10)
              for value in dependencies.stdout.splitlines():
                  if re.search(r"Generative|Partner|Authentication|ModelService|Anvil", value, re.I):
                      emit("dependency", component=name, value=value.strip())
          
          for relative in ("Contents/PlugIns/IDEIntelligenceChat.framework/Versions/A/Resources/ApprovedIntegrationModelPairings.plist",
                           "Contents/PlugIns/IDEIntelligenceChat.framework/Versions/A/Resources/OnboardingIntelligenceXcode.bundle/Contents/Resources/IntelligenceInXcode.plist"):
              path = app / relative
              if path.is_file() and path.stat().st_size < 128 * 1024:
                  value = plistlib.loads(path.read_bytes())
                  emit("resource_metadata", path=relative, value=json.dumps(value, default=str)[:12000])
          
          system = pathlib.Path("/System/Library")
          for relative in ("PrivateFrameworks", "ExtensionKit/Extensions", "Frameworks"):
              directory = system / relative
              if not directory.is_dir():
                  continue
              for bundle in sorted(directory.iterdir()):
                  if not re.search(r"ChatGPT|OpenAI|GenerativePartner|ExternalAI|GenerativeAssistant|Anvil", bundle.name, re.I):
                      continue
                  plist = next((p for p in (bundle / "Contents/Info.plist", bundle / "Resources/Info.plist")
                                if p.is_file()), None)
                  meta = plistlib.loads(plist.read_bytes()) if plist else {}
                  exe = meta.get("CFBundleExecutable") or bundle.stem
                  candidates = [bundle / "Contents/MacOS" / exe, bundle / exe, bundle / "Versions/A" / exe]
                  binary = next((p for p in candidates if p.is_file()), None)
                  emit("system_component", path=str(bundle), bundle_id=meta.get("CFBundleIdentifier"),
                       executable_present=bool(binary), binary=str(binary) if binary else None)
                  if not binary or binary.stat().st_size > 64 * 1024**2:
                      continue
                  data = binary.read_bytes()
                  try:
                      sections = macho_sections(data)
                  except (ValueError, struct.error):
                      continue
                  count = 0
                  for segment, section, offset, length, address in sections:
                      if section != "__cstring":
                          continue
                      for item in re.finditer(rb"[^\x00]{4,2048}", data[offset:offset + length]):
                          value = item.group().decode("utf-8", errors="replace")
                          if re.search(r"https?://|chatgpt|openai|oauth|apple-chatgpt|client.?id|attest", value, re.I):
                              emit("system_constant", component=bundle.name, offset=hex(offset + item.start()),
                                   value=safe_text(value))
                              count += 1
                              if count >= 100:
                                  break
                      if count >= 100:
                          break
          emit("trace_complete", seconds=round(time.monotonic()-started, 1), dynamic_auth_test=False)
          tool = subprocess.run(["/usr/bin/xcrun", "--find", "dyld_info"],
                                capture_output=True, text=True, timeout=10)
          emit("cache_tool", path=tool.stdout.strip(), returncode=tool.returncode)
          cache_signal = re.compile(r"https?://|chatgpt|openai|oauth|apple-chatgpt|client.?id|"
                                    r"authorize|authorization|private.?token|attest|device_secret|"
                                    r"refresh_token|scope|audience|x-request|session[./]|xcode", re.I)
          uuid_rx = re.compile(r"[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}")
          if tool.returncode == 0:
              for name in ("Anvil", "GenerativePartnerService", "GenerativePartnerServiceUI"):
                  for relative in (f"{name}.framework/Versions/A/{name}", f"{name}.framework/{name}"):
                      image_path = "/System/Library/PrivateFrameworks/" + relative
                      command = [tool.stdout.strip(), "-uuid", "-section", "__TEXT", "__cstring",
                                 "-section", "__DATA_CONST", "__cfstring",
                                 "-section", "__DATA", "__cfstring", image_path]
                      try:
                          result = subprocess.run(command, capture_output=True, text=True, timeout=20)
                      except subprocess.TimeoutExpired:
                          emit("cache_error", component=name, image=image_path, error="20 second timeout")
                          continue
                      lines = result.stdout.splitlines()
                      found_uuid = uuid_rx.search(result.stdout)
                      emit("cache_image", component=name, image=image_path, returncode=result.returncode,
                           uuid=found_uuid.group() if found_uuid else None,
                           header=[safe_text(v) for v in lines[:5]],
                           diagnostics=safe_text(result.stderr[:1200]))
                      if result.returncode or not found_uuid:
                          continue
                      indices = set()
                      for i, line in enumerate(lines):
                          if cache_signal.search(line) or re.search(r"\bapp_[A-Za-z0-9_-]{8,100}\b", line):
                              indices.update(range(max(0, i - 1), min(len(lines), i + 2)))
                      ranked = sorted(indices, key=lambda i: (
                          not bool(re.search(r"https?://|apple-chatgpt|app_[A-Za-z0-9_-]{8,}|com.apple.openai", lines[i], re.I)),
                          not bool(cache_signal.search(lines[i])), i))
                      for i in ranked[:350]:
                          emit("cache_constant", component=name, value=safe_text(lines[i]))
                      emit("cache_coverage", component=name, lines=len(lines), candidates=len(ranked),
                           emitted=min(len(ranked), 350), truncated=len(ranked) > 350)
                      break
          emit("cache_trace_complete", seconds=round(time.monotonic()-started, 1), dynamic_auth_test=False)
          
          # Read static metadata and selected disassembly; never load the target framework.
          import tempfile
          from collections import deque
          
          if tool.returncode == 0:
              anvil_image = "/System/Library/PrivateFrameworks/Anvil.framework/Versions/A/Anvil"
              dyld_tool = tool.stdout.strip()
              export_run = subprocess.run([dyld_tool, "-uuid", "-exports", anvil_image],
                                          capture_output=True, text=True, timeout=20)
              export_uuid = uuid_rx.search(export_run.stdout)
              emit("protocol_image", image=anvil_image, uuid=export_uuid.group() if export_uuid else None,
                   returncode=export_run.returncode, diagnostics=safe_text(export_run.stderr[:1200]))
              if export_run.returncode == 0 and export_uuid:
                  symbols_run = subprocess.run(["/usr/bin/xcrun", "swift-demangle", "--compact"],
                                               input=export_run.stdout, capture_output=True, text=True, timeout=20)
                  if symbols_run.returncode:
                      raise RuntimeError("Swift symbol demangling failed")
                  symbol_rx = re.compile(r"clientID|clientIdentifier|appID|OAuth|AuthenticationService|"
                                         r"ChatGPTXcode|Ticketing|RateLimiting|Session.*Request|"
                                         r"Response.*Request|Request.*Response|ChatGPTConfiguration|"
                                         r"HTTPRequest|HTTPClient", re.I)
                  matches = [line for line in symbols_run.stdout.splitlines() if symbol_rx.search(line)]
                  for line in matches[:260]:
                      emit("protocol_symbol", value=safe_text(line))
                  emit("protocol_symbol_coverage", candidates=len(matches), emitted=min(len(matches), 260),
                       truncated=len(matches) > 260)
          
                  reflection_run = subprocess.run(
                      [dyld_tool, "-section_bytes", "__TEXT", "__swift5_reflstr", anvil_image],
                      capture_output=True, text=True, timeout=20)
                  reflection = bytearray()
                  previous_end = None
                  gaps = 0
                  for line in reflection_run.stdout.splitlines():
                      match = re.fullmatch(r"0x([0-9a-fA-F]+): ((?:[0-9a-fA-F]{2} ?)+)", line.strip())
                      if not match:
                          continue
                      address = int(match.group(1), 16)
                      chunk = bytes.fromhex(match.group(2))
                      if previous_end is not None and address != previous_end:
                          reflection.append(0)
                          gaps += 1
                      reflection.extend(chunk)
                      previous_end = address + len(chunk)
                  fields = sorted(set(part.decode("utf-8", errors="replace") for part in reflection.split(b"\0")
                                      if 1 <= len(part) <= 160))
                  emit("protocol_reflection", returncode=reflection_run.returncode, bytes=len(reflection),
                       address_gaps=gaps, fields=fields[:450], truncated=len(fields) > 450,
                       diagnostics=safe_text(reflection_run.stderr[:1200]))
          
                  # Spool the full tool output only on the disposable runner; publish bounded excerpts.
                  with tempfile.TemporaryFile(mode="w+", encoding="utf-8") as raw_asm, \
                          tempfile.TemporaryFile(mode="w+", encoding="utf-8") as demangled_asm:
                      try:
                          dis_run = subprocess.run([dyld_tool, "-disassemble", anvil_image],
                                                   stdout=raw_asm, stderr=subprocess.PIPE, text=True, timeout=35)
                          raw_size = raw_asm.tell()
                          if raw_size > 96 * 1024**2:
                              raise ValueError("Disassembly exceeds 96 MiB analysis limit")
                          raw_asm.seek(0)
                          demangle_run = subprocess.run(["/usr/bin/xcrun", "swift-demangle", "--compact"],
                                                       stdin=raw_asm, stdout=demangled_asm,
                                                       stderr=subprocess.PIPE, text=True, timeout=25)
                          emit("protocol_disassembly", returncode=dis_run.returncode,
                               demangle_returncode=demangle_run.returncode, bytes=raw_size,
                               diagnostics=safe_text((dis_run.stderr + demangle_run.stderr)[:1200]))
                          if dis_run.returncode or demangle_run.returncode:
                              raise ValueError("Static disassembly or demangling failed")
                          demangled_asm.seek(0)
                          selected_rx = re.compile(r"(?:Configuration|Config|AuthenticationService).*"
                                                   r"(?:clientID|clientIdentifier|appID|authorizationURL|authorizeURL)", re.I)
                          xref_rx = re.compile(r"app_[A-Za-z0-9_-]{8,}|apple\.v1\.request|"
                                               r"apple-chatgpt://|Overrides\.ChatGPTXcode")
                          nearest_symbol = None
                          selected = False
                          function_lines = []
                          function_size = 0
                          emitted_functions = 0
                          xrefs = 0
                          context = deque(maxlen=5)
          
                          def flush_function():
                              if selected:
                                  emit("protocol_function", symbol=nearest_symbol, lines=function_lines,
                                       total_lines=function_size, truncated=function_size > len(function_lines))
          
                          for raw_line in demangled_asm:
                              line = raw_line.rstrip()
                              if not line.startswith(("0x", " ", "\t")) and line.endswith(":"):
                                  flush_function()
                                  nearest_symbol = line[:-1]
                                  selected = bool(selected_rx.search(nearest_symbol)) and emitted_functions < 18
                                  if selected:
                                      emitted_functions += 1
                                  function_lines = []
                                  function_size = 0
                              elif line.startswith("0x"):
                                  function_size += 1
                                  if selected and len(function_lines) < 120:
                                      function_lines.append(safe_text(line))
                              if xref_rx.search(line) and xrefs < 30:
                                  emit("protocol_xref", nearest_symbol=nearest_symbol,
                                       context=list(context), value=safe_text(line))
                                  xrefs += 1
                              context.append(safe_text(line))
                          flush_function()
                          emit("protocol_disassembly_coverage", functions=emitted_functions, xrefs=xrefs,
                               max_functions=18, max_lines_per_function=120, max_xrefs=30)
                      except (subprocess.TimeoutExpired, ValueError) as error:
                          emit("protocol_disassembly_error", error=str(error))
          emit("protocol_trace_complete", seconds=round(time.monotonic()-started, 1), dynamic_auth_test=False)
          PY
