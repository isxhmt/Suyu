name: Inspect Xcode ChatGPT protocol constants
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/xcode-protocol-check.yml]
permissions: {}
jobs:
  inspect:
    runs-on: macos-26
    timeout-minutes: 3
    steps:
      - name: Read preinstalled Xcode only
        shell: bash
        run: |
          python3 -I - <<'PY'
          import json, mmap, os, pathlib, plistlib, re, subprocess, time
          from urllib.parse import urlsplit
          
          def emit(kind, **data):
              print(json.dumps({"kind": kind, **data}, ensure_ascii=True), flush=True)
          
          url_rx = re.compile(r"https?://[^\s\"'<>\\]{4,256}")
          signal_rx = re.compile(r"chatgpt|openai|apple-relay|authclient|oauth|client[_-]?id|"
                                 r"originator|backend-api|/responses|response\.create|text/event-stream", re.I)
          client_rx = re.compile(r"^app_[A-Za-z0-9_-]{8,100}$")
          patterns = [(re.compile(rb"[\x20-\x7e]{6,384}"), "ascii"),
                      (re.compile(rb"(?:[\x20-\x7e]\x00){6,384}"), "utf-16le")]
          
          def clean_url(value):
              try:
                  p = urlsplit(value.rstrip("),.;"))
                  if not p.hostname:
                      return "[invalid-url]"
                  host = f"[{p.hostname}]" if ":" in p.hostname else p.hostname
                  if p.port is not None:
                      host += f":{p.port}"
                  return f"{p.scheme}://{host}{p.path}"
              except ValueError:
                  return "[invalid-url]"
          
          def scan(data, deadline):
              found, other = set(), set()
              for pattern, encoding in patterns:
                  for item in pattern.finditer(data):
                      if time.monotonic() > deadline:
                          return found | other, True
                      text = item.group().decode(encoding, errors="ignore")
                      for url in url_rx.findall(text):
                          target = found if signal_rx.search(url) else other
                          if target is found or len(other) < 50:
                              target.add(("url", clean_url(url)))
                      if signal_rx.search(text) or client_rx.fullmatch(text):
                          text = url_rx.sub(lambda m: clean_url(m.group()), text)
                          found.add(("protocol_string", text[:240]))
                      if len(found) >= 500:
                          return found | other, True
              return found | other, False
          
          started = time.monotonic()
          selected = os.environ.get("DEVELOPER_DIR") or subprocess.check_output(
              ["/usr/bin/xcode-select", "-p"], text=True, timeout=5).strip()
          selected = pathlib.Path(selected).resolve()
          app = next((p for p in (selected, *selected.parents) if p.suffix == ".app"), None)
          if not app or app.parent != pathlib.Path("/Applications") or not app.name.startswith("Xcode"):
              raise SystemExit("Selected developer directory is not an /Applications/Xcode*.app")
          info = plistlib.loads((app / "Contents/Info.plist").read_bytes())
          version = str(info.get("CFBundleShortVersionString", ""))
          if not version.split(".")[0].isdigit() or int(version.split(".")[0]) < 26:
              raise SystemExit("Xcode 26 or newer is required")
          emit("xcode", path=str(app), version=version,
               bundle_id=info.get("CFBundleIdentifier"), build=info.get("ProductBuildVersion"))
          deadline = time.monotonic() + 75
          name_rx = re.compile(r"intelligence|codingassistant|assistant|chat|openai|codex|"
                               r"idefoundation|devtoolscore|dvtfoundation", re.I)
          specific_rx = re.compile(r"intelligence|codingassistant|chat|openai|codex", re.I)
          roots = ["PlugIns", "SharedFrameworks", "Frameworks",
                   "Developer/Library/Xcode/Plug-ins", "Developer/Library/PrivateFrameworks",
                   "Developer/Library/Frameworks"]
          bundles, visited = set(), 0
          for relative in roots:
              for current, dirs, files in os.walk(app / "Contents" / relative, followlinks=False):
                  visited += 1
                  dirs[:] = sorted(d for d in dirs if not d.endswith((".lproj", ".dSYM")))
                  p = pathlib.Path(current)
                  if p.suffix in (".framework", ".ideplugin", ".bundle", ".xpc") and name_rx.search(p.name):
                      bundles.add(p)
                  if visited >= 3000 or time.monotonic() > deadline:
                      break
              if visited >= 3000 or time.monotonic() > deadline:
                  break
          
          def inside(p):
              p = p.resolve()
              return p if p.is_relative_to(app) and p.is_file() else None
          
          seen, used, matches, scanned = set(), 0, 0, 0
          ordered = sorted(bundles, key=lambda p: (not bool(specific_rx.search(p.name)), str(p)))
          for bundle in ordered[:24]:
              if time.monotonic() > deadline or matches >= 160:
                  break
              plist = next((p for q in ("Contents/Info.plist", "Resources/Info.plist",
                           "Versions/Current/Resources/Info.plist", "Info.plist")
                           if (p := inside(bundle / q))), None)
              if not plist:
                  continue
              try:
                  meta = plistlib.loads(plist.read_bytes())
              except (ValueError, OSError):
                  continue
              exe = meta.get("CFBundleExecutable", "")
              emit("bundle", path=str(bundle.relative_to(app)), id=meta.get("CFBundleIdentifier"),
                   version=meta.get("CFBundleShortVersionString"), executable=exe)
              if not isinstance(exe, str) or not exe or "/" in exe or "\\" in exe:
                  continue
              targets = [bundle / "Contents/MacOS" / exe, bundle / exe,
                         bundle / "Versions/Current" / exe, plist]
              for raw in targets:
                  if time.monotonic() > deadline or matches >= 160:
                      break
                  p = inside(raw)
                  if not p or p in seen:
                      continue
                  seen.add(p)
                  size = p.stat().st_size
                  if not size or size > 256 * 1024**2 or used + size > 512 * 1024**2:
                      emit("skip_budget", path=str(p.relative_to(app)), bytes=size)
                      continue
                  used += size
                  scanned += 1
                  with p.open("rb") as stream, mmap.mmap(stream.fileno(), 0, access=mmap.ACCESS_READ) as data:
                      found, limited = scan(data, deadline)
                  ranked = sorted(found, key=lambda v: (not bool(signal_rx.search(v[1])),
                                                        v[0] != "url", v[1]))
                  for kind, value in ranked[:16]:
                      if matches >= 160:
                          break
                      emit(kind, path=str(p.relative_to(app)), value=value)
                      matches += 1
                  if limited or len(ranked) > 16:
                      emit("file_truncated", path=str(p.relative_to(app)), candidates=len(ranked))
          emit("coverage", bundles_found=len(bundles), files_scanned=scanned, bytes_scanned=used,
               matches=matches, directories=visited, seconds=round(time.monotonic()-started, 1),
               time_limit_reached=time.monotonic() > deadline,
               directory_limit_reached=visited >= 3000, bundle_limit_reached=len(bundles) > 24,
               output_limit_reached=matches >= 160)
          PY
